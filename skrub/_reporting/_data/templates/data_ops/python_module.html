<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ module_name }}</title>

<!-- Prism.js (v1.29.0, MIT license) is vendored in prism-1.29.0/ so that this
     page is fully standalone and does not require a network connection.
     See prism-1.29.0/README.md and prism-1.29.0/LICENSE. -->
<style>
{% include "prism-1.29.0/prism.min.css" %}
{% include "prism-1.29.0/prism-line-numbers.min.css" %}
{% include "prism-1.29.0/prism-line-highlight.min.css" %}
</style>

<style>
  /* compact layout: this page is displayed in the drawer of the index page */
  html, body { height: 100%; }
  body {
    font-family: sans-serif;
    margin: 0;
    padding: 1em 1.5em;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  /* The file name stays visible and the code scrolls on its own, so that the
     horizontal scrollbar is always at the bottom of the view. */
  h1 {
    flex: none;
    margin: 0 0 0.75em;
    font-size: 1.15rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .code-scroll { flex: 1 1 auto; min-height: 0; overflow: auto; }
  /* Let .code-scroll do the scrolling (instead of the <pre> from prism) so that
     the horizontal scrollbar sits at the bottom of the view. */
  pre[class*="language-"] {
    font-size: 0.95em;
    margin: 0;
    box-sizing: border-box;
    width: max-content;
    min-width: 100%;
    overflow: visible;
  }
  /* Prism sets a pixel width on the highlight when a line is selected; that
     width goes stale when the drawer is resized and then makes the page scroll
     horizontally. Let it span the code block instead (it is positioned with
     left: 0 and right: 0). */
  .line-highlight { width: auto !important; }
</style>
</head>
<body>

    <h1><code>{{ source_file }}</code></h1>

<div class="code-scroll">
<pre id="code-container" class="line-numbers" data-line=""><code class="language-python" id="code">{{ python_source_code }}</code></pre>
</div>

<script>
{% include "prism-1.29.0/prism-core.min.js" %}
{% include "prism-1.29.0/prism-python.min.js" %}
{% include "prism-1.29.0/prism-line-numbers.min.js" %}
{% include "prism-1.29.0/prism-line-highlight.min.js" %}
</script>

<script>
  // Parse "#L5" (GitHub/GitLab style) from the URL hash and return the line number, or null.
  function lineFromHash() {
    var m = /^#?L(\d+)$/.exec(location.hash);
    return m ? m[1] : null;
  }

  var codeEl = document.getElementById('code');
  var containerEl = document.getElementById('code-container');

  // Tell the line-highlight plugin which line to highlight (if any).
  var line = lineFromHash();
  if (line) containerEl.setAttribute('data-line', line);

  // Highlight + render line numbers / line highlight. The Python source is
  // already embedded in the <code> element above, so no fetch() is needed.
  Prism.highlightElement(codeEl);

  // Scroll the highlighted line into view once Prism has rendered the highlight overlay.
  if (line) {
    setTimeout(function () {
      var highlightEl = containerEl.querySelector('.line-highlight');
      if (highlightEl) highlightEl.scrollIntoView({ block: 'center' });
    }, 0);
  }

  // Support changing the hash while the page is open (e.g. user edits #L2 -> #L3).
  window.addEventListener('hashchange', function () {
    location.reload();
  });
</script>

</body>
</html>
