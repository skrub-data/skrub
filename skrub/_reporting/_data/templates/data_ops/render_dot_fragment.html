<div id="{{ uuid }}">Loading graph …</div>
<script type="module">
 import { Graphviz } from "https://cdn.jsdelivr.net/npm/@hpcc-js/wasm-graphviz@1/dist/index.js";
 const dot = new TextDecoder().decode(Uint8Array.from(atob("{{ dot_base64 }}"), c => c.charCodeAt(0)));
 try {
     const graphviz = await Graphviz.load();
     const container = document.getElementById("{{ uuid }}");
     // graphviz only outputs the single family it was given; add fallbacks.
     container.innerHTML = graphviz.dot(dot).replaceAll(
         'font-family="Arial"', 'font-family="Arial,Helvetica,sans-serif"');
     container.dispatchEvent(new CustomEvent("graph-rendered", {bubbles: true}));
 } catch (err) {
     document.getElementById("{{ uuid }}").textContent = "Error: " + err.message;
 }
 parent.postMessage({ "{{ uuid }}_h": document.body.scrollHeight + 20, "{{ uuid }}_w": document.body.scrollWidth + 20}, "*");
</script>
